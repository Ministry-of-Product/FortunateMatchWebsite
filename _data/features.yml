- title: Intent-Based Matching
  icon: crosshair
  description: Connections are suggested based on what you want and offer at this specific event — not a generic profile.

- title: AI-Generated Suggestions
  icon: sparkles
  description: Smart algorithms surface your best matches with clear reasoning for why you should connect.

- title: Voice Notes & Transcription
  icon: mic
  description: Record voice memos after conversations and get AI-powered summaries so you never forget key details.

- title: Collaborative Matching
  icon: users
  description: Attendees can suggest matches between others, letting the crowd improve matchmaking for everyone.

- title: Cooperative Group Scoring
  icon: trophy
  description: No individual leaderboard — the whole event shares a group score. Everyone wins when more people find the right connections.

- title: Ephemeral by Design
  icon: shield
  description: Event data expires automatically. You own your data and can export it anytime.
